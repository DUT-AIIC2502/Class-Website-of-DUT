{% extends "base.html" %}

{% block title %}标题{% endblock %}

{% block special_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style_info_management.css') }}">
{% endblock %}

{% block content %}
    <div class="container" style="padding: 16px;">
        <h2>新功能演示</h2>
        <div style="margin-top: 12px;">
            <label for="gpt5-toggle" style="display: inline-flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="gpt5-toggle" />
                启用 GPT-5
            </label>
            <span id="gpt5-status" style="margin-left: 8px; color: #666;">状态：未知</span>
        </div>

        <div style="margin-top: 16px;">
            <form id="prompt-form">
                <input type="text" id="prompt-input" name="prompt" placeholder="输入提示词，例如：请介绍DUT" style="width: 320px;"/>
                <button type="submit">发送到 GPT-5</button>
            </form>
            <pre id="prompt-result" style="white-space: pre-wrap; background: #f6f6f6; padding: 8px; margin-top: 8px;"></pre>
        </div>
    </div>

    <script>
    async function refreshStatus() {
        try {
            const res = await fetch("{{ url_for('new.gpt5_status') }}");
            const data = await res.json();
            const checked = !!data.enable_gpt5;
            document.getElementById('gpt5-toggle').checked = checked;
            document.getElementById('gpt5-status').textContent = '状态：' + (checked ? '已启用' : '未启用');
        } catch (e) {
            document.getElementById('gpt5-status').textContent = '状态：获取失败';
        }
    }

    async function setStatus(enabled) {
        try {
            const res = await fetch("{{ url_for('new.gpt5_toggle') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enable_gpt5: enabled })
            });
            const data = await res.json();
            const checked = !!data.enable_gpt5;
            document.getElementById('gpt5-toggle').checked = checked;
            document.getElementById('gpt5-status').textContent = '状态：' + (checked ? '已启用' : '未启用');
        } catch (e) {
            alert('切换失败：' + (e?.message || e));
        }
    }

    document.getElementById('gpt5-toggle').addEventListener('change', (ev) => {
        setStatus(ev.target.checked);
    });

    document.getElementById('prompt-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const prompt = document.getElementById('prompt-input').value || '';
        try {
            const res = await fetch("{{ url_for('new.new_function') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const data = await res.json();
            if (data.ok) {
                document.getElementById('prompt-result').textContent = data.result || '';
            } else {
                document.getElementById('prompt-result').textContent = '错误：' + (data.error || '未知错误');
            }
        } catch (e) {
            document.getElementById('prompt-result').textContent = '请求失败：' + (e?.message || e);
        }
    });

    // 页面加载时刷新一次状态
    refreshStatus();
    </script>
{% endblock %}
